# Netlify: base directory is /website (set in the UI), so paths here are relative to it.
# The site is a static export (output: "export" in next.config.ts): publish out/ and skip the Next.js adapter.
[build]
  command = "bun install --frozen-lockfile && bun run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.12"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
