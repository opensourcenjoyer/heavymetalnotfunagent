# Fly.io: one always-on machine with a volume for ~/.heavymetal (config, wizzy.db, heavymetal.db).
# fly launch --no-deploy --copy-config ; fly volumes create wizzy_data --size 1 ; set secrets, then fly deploy.
app = "wizzy-bot"
primary_region = "fra"

[build]

[env]
  HEAVYMETAL_HOME = "/data"

[[mounts]]
  source = "wizzy_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
